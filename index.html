<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Onira - Journal de Rêves IA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    html, body {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      touch-action: manipulation;
    }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #f4f1ea; 
    }
    
    .font-brand { 
      font-family: 'Cinzel', serif; 
      letter-spacing: 0.22em; 
    }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .orb-glow {
      background: radial-gradient(circle at 45% 45%, #ffffff 0%, #ffe8b8 25%, #ffd1dc 50%, #d6e4ff 75%, #f5e6ff 100%);
      box-shadow: 0 15px 35px rgba(230, 200, 160, 0.35), 0 0 25px rgba(210, 220, 255, 0.4);
      transition: all 0.3s ease;
    }
    
    .orb-pulse { 
      animation: pulse-soft 3.2s ease-in-out infinite; 
    }
    
    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.04); filter: brightness(1.08); box-shadow: 0 20px 45px rgba(230, 195, 140, 0.5); }
    }
    
    .recording-active { 
      animation: pulse-rec 1s ease-in-out infinite alternate !important; 
      border: 3px solid rgba(239, 68, 68, 0.6) !important; 
    }
    
    @keyframes pulse-rec {
      from { transform: scale(0.97); filter: brightness(1.05); }
      to { transform: scale(1.06); filter: brightness(1.2); box-shadow: 0 0 45px rgba(245, 100, 100, 0.45); }
    }

    #orb * {
      pointer-events: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 select-none bg-[#f4f1ea]">

  <div class="relative w-full max-w-[390px] h-[100dvh] sm:h-[min(844px,92vh)] bg-[#faf8f5] text-[#2d2926] rounded-none sm:rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between border-0 sm:border-[6px] border-[#e8e2d8]">

    <!-- ÉCRAN ONBOARDING -->
    <div id="screen-onboarding" class="hidden absolute inset-0 z-[60] bg-[#faf8f5] flex flex-col justify-between p-6 sm:rounded-[38px] overflow-y-auto no-scrollbar">
      <div class="flex-1 flex flex-col items-center justify-center text-center relative overflow-hidden mt-6 min-h-[360px]">
        
        <!-- Slide 0 -->
        <div id="slide-0" class="slide-content absolute inset-0 flex flex-col items-center justify-center transition-opacity duration-500">
          <div class="w-24 h-24 mb-6 rounded-full orb-glow flex items-center justify-center text-3xl shadow-sm">✨</div>
          <h2 data-i18n="onbTitle1" class="text-xl font-brand font-bold text-[#9e7d3b] mb-3"></h2>
          <p data-i18n="onbDesc1" class="text-xs text-[#524b45] leading-relaxed px-4"></p>
        </div>

        <!-- Slide 1 -->
        <div id="slide-1" class="slide-content absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
          <div class="w-24 h-24 mb-6 rounded-full orb-glow flex items-center justify-center text-3xl shadow-sm">🎙️</div>
          <h2 data-i18n="onbTitle2" class="text-xl font-brand font-bold text-[#9e7d3b] mb-3"></h2>
          <p data-i18n="onbDesc2" class="text-xs text-[#524b45] leading-relaxed px-4"></p>
        </div>

        <!-- Slide 2 -->
        <div id="slide-2" class="slide-content absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
          <div class="w-24 h-24 mb-6 rounded-full orb-glow flex items-center justify-center text-3xl shadow-sm">📖</div>
          <h2 data-i18n="onbTitle3" class="text-xl font-brand font-bold text-[#9e7d3b] mb-3"></h2>
          <p data-i18n="onbDesc3" class="text-xs text-[#524b45] leading-relaxed px-4"></p>
        </div>

        <!-- Slide 3 (Formulaire fluide : Prénom + Email + Selfie) -->
        <div id="slide-3" class="slide-content absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
          <div class="relative w-16 h-16 mb-2 rounded-full orb-glow flex items-center justify-center overflow-hidden border-2 border-[#caa255] bg-white shadow-inner">
            <img id="avatar-preview" src="" class="hidden w-full h-full object-cover">
            <span id="avatar-icon" class="text-2xl">👤</span>
          </div>
          <h2 class="text-base font-brand font-bold text-[#9e7d3b] mb-3">Votre profil Onira</h2>
          
          <div class="w-full max-w-[260px] flex flex-col gap-2.5">
            <input type="text" id="input-prenom" placeholder="Votre prénom (ex: Marie)" class="w-full px-4 py-3 rounded-xl text-xs border border-[#e2d7c5] focus:outline-none focus:border-[#caa255] bg-white text-[#2d2926]">
            <input type="email" id="input-email" placeholder="Email (pour sécuriser vos achats)" class="w-full px-4 py-3 rounded-xl text-xs border border-[#e2d7c5] focus:outline-none focus:border-[#caa255] bg-white text-[#2d2926]">
            
            <input type="file" id="camera-input" accept="image/*" capture="user" class="hidden" onchange="handleSelfie(event)">
            <button id="btn-selfie" type="button" onclick="document.getElementById('camera-input').click()" class="w-full px-4 py-2 mt-1 bg-white border border-[#caa255] text-[#9e7d3b] rounded-xl text-xs font-bold shadow-sm hover:bg-[#faf8f5] active:scale-95 transition-all">
              📸 Prendre un selfie (Optionnel)
            </button>
          </div>
        </div>

      </div>

      <!-- Boutons Onboarding -->
      <div class="mb-4 flex flex-col items-center w-full flex-shrink-0">
        <div class="flex gap-2 mb-6" id="dots-container">
          <div id="dot-0" class="w-2 h-2 rounded-full bg-[#9e7d3b] transition-all"></div>
          <div id="dot-1" class="w-2 h-2 rounded-full bg-[#e2d7c5] transition-all"></div>
          <div id="dot-2" class="w-2 h-2 rounded-full bg-[#e2d7c5] transition-all"></div>
          <div id="dot-3" class="w-2 h-2 rounded-full bg-[#e2d7c5] transition-all"></div>
        </div>
        <button id="btn-next-slide" onclick="nextOnboardingSlide()" data-i18n="onbBtnNext" class="w-full py-3.5 bg-[#9e7d3b] text-white rounded-xl text-xs font-semibold shadow-lg hover:bg-[#886a30] active:scale-[0.99] transition-all"></button>
        
        <!-- Le bouton final déclenche la connexion instantanée -->
        <button id="btn-start-app" onclick="finishOnboarding()" data-i18n="onbBtnStart" class="hidden w-full py-3.5 bg-[#9e7d3b] text-white rounded-xl text-xs font-bold shadow-lg hover:bg-[#886a30] active:scale-[0.99] transition-all"></button>
      </div>
    </div>

    <!-- En-tête : Badge Crédits Restants -->
    <div class="absolute top-4 sm:top-6 right-5 z-20 flex items-center gap-2">
      <button onclick="openRechargeModal()" id="credits-badge" class="px-3 py-1 rounded-full bg-white/90 border border-[#e2d7c5] text-[11px] font-bold text-[#9e7d3b] shadow-sm flex items-center gap-1.5 active:scale-95 transition-all hover:border-[#caa255]">
        <span id="credits-count">...</span>
        <span>✨</span>
        <span class="text-[9px] text-[#a88644] font-normal border-l border-[#e2d7c5] pl-1.5">+</span>
      </button>
    </div>

    <!-- ÉCRAN 1 : ACCUEIL -->
    <div id="screen-home" class="flex-1 flex flex-col justify-between overflow-hidden">
      <header class="pt-4 sm:pt-6 pb-0 px-6 text-center flex-shrink-0">
        <div class="mx-auto w-8 h-8 rounded-full mb-1 flex items-center justify-center p-0.5 relative">
          <div class="w-full h-full rounded-full border border-[#e5c583]/60 flex items-center justify-center shadow-inner" style="background: radial-gradient(circle, #fffdf8 30%, #fde7b0 70%, #d8e5ff 100%);">
            <div class="w-2.5 h-2.5 rounded-full bg-gradient-to-tr from-[#eac575] to-[#f4dca6]"></div>
          </div>
        </div>
        <h1 class="font-brand text-[11px] font-bold text-[#9e7d3b] tracking-[0.28em] uppercase">ONIRA</h1>
        
        <!-- TEXTE DYNAMIQUE: Bonjour Marie, mercredi 23 septembre -->
        <p id="texte-bonjour" class="text-xs font-semibold text-[#524b45] mt-1.5"></p>
      </header>

      <main class="flex-1 flex flex-col items-center justify-evenly px-5 py-2 min-h-0">
        <button 
          id="orb" 
          type="button"
          onclick="handleRecordAction()"
          style="touch-action: manipulation; -webkit-tap-highlight-color: transparent;"
          class="w-40 h-40 rounded-full orb-glow orb-pulse flex flex-col items-center justify-center relative cursor-pointer active:scale-95 transition-all outline-none border-0"
        >
          <div id="orb-center-icon" class="text-2xl mb-1 transition-all">✨</div>
          <div class="px-3.5 py-1 bg-white/85 backdrop-blur-md rounded-full border border-white flex items-center shadow-sm">
            <div id="record-indicator" class="w-2 h-2 rounded-full bg-[#caa255] mr-2"></div>
            <span id="badge-text" data-i18n="recordBadge" class="text-[11px] font-bold text-[#7c6332]"></span>
          </div>
        </button>

        <div class="text-center px-2 max-w-[280px]">
          <h2 id="instruction-title" data-i18n="instructionTitle" class="text-xs font-semibold text-[#3b342f]"></h2>
          <p id="instruction-sub" data-i18n="instructionSub" class="text-[10px] text-[#91867c] mt-0.5 min-h-[1.2rem] line-clamp-2"></p>
        </div>

        <div class="w-full">
          <div class="flex justify-between items-center text-[10px] text-[#8e857c] px-1 mb-1.5 font-medium">
            <span data-i18n="recentDreams"></span>
            <button onclick="switchTab('journal')" data-i18n="viewJournal" class="text-[#a88644] text-[10px] hover:underline font-semibold"></button>
          </div>
          <div id="home-recents-grid" class="grid grid-cols-2 gap-2">
            <div class="col-span-2 text-center text-[10px] text-[#a3978b] py-2 italic" data-i18n="syncing"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- ÉCRAN 2 : CHARGEMENT -->
    <div id="screen-loading" class="hidden flex-1 flex flex-col items-center justify-center px-8 text-center bg-[#faf8f5]">
      <div class="w-28 h-28 rounded-full orb-glow orb-pulse flex items-center justify-center mb-5">
        <svg class="w-9 h-9 text-[#a88644] animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </div>
      <h3 id="loading-step" data-i18n="loadingTitle" class="text-xs font-semibold text-[#2d2926]"></h3>
      <p id="loading-sub" data-i18n="loadingSub" class="text-[10px] text-[#8c827a] mt-1"></p>
    </div>

    <!-- ÉCRAN 3 : RÉSULTAT -->
    <div id="screen-result" class="hidden flex-1 flex flex-col overflow-y-auto no-scrollbar p-4">
      <div class="flex justify-between items-center mb-2.5">
        <span data-i18n="newDream" class="text-[10px] uppercase font-bold tracking-widest text-[#a88644]"></span>
        <button onclick="switchTab('home')" class="text-xs text-[#8c827a] p-1 font-bold">✕</button>
      </div>

      <div class="relative rounded-2xl overflow-hidden shadow-md h-48 border border-[#e5ded2] mb-3 bg-[#f0ebd8]">
        <img id="result-img" src="" class="w-full h-full object-cover hidden">
        <div id="result-img-placeholder" class="text-center p-4 pt-16">
          <svg class="w-8 h-8 mx-auto text-[#caa255] animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-transparent flex items-end p-3">
          <div>
            <span id="result-badge" class="px-2 py-0.5 rounded-full text-[8px] font-semibold bg-[#a88644] text-white"></span>
            <h2 id="result-title" class="text-sm font-bold text-white mt-1"></h2>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl p-3.5 border border-[#eee7db] shadow-sm mb-2.5">
        <h3 data-i18n="decryptionTitle" class="text-[10px] font-bold text-[#9e7d3b] uppercase tracking-wider mb-1.5"></h3>
        <p id="result-interpretation" class="text-xs text-[#524b45] leading-relaxed"></p>
      </div>

      <div class="bg-[#f2ece2]/60 rounded-xl p-3 border border-[#eee7db] mb-3">
        <p data-i18n="yourStory" class="text-[9px] font-semibold text-[#8c827a] mb-1"></p>
        <p id="result-transcript" class="text-[11px] text-[#635b54] italic leading-relaxed"></p>
      </div>

      <button id="save-btn" onclick="saveDream()" data-i18n="saveBtn" class="w-full py-2.5 bg-[#9e7d3b] hover:bg-[#886a30] text-white rounded-xl text-xs font-semibold shadow transition-all mb-4"></button>
    </div>

    <!-- ÉCRAN 4 : JOURNAL -->
    <div id="screen-journal" class="hidden flex-1 flex flex-col overflow-hidden">
      <header class="pt-4 sm:pt-6 pb-2.5 px-5 border-b border-[#eee8dc] bg-[#faf8f5]/90 flex-shrink-0">
        <h1 data-i18n="journalTitle" class="text-base font-bold text-[#2d2926]"></h1>
        <p id="journal-count" class="text-[10px] text-[#91867c]">...</p>
      </header>
      <main class="flex-1 overflow-y-auto no-scrollbar p-3.5">
        <div id="journal-grid" class="grid grid-cols-2 gap-2.5 pb-4"></div>
      </main>
    </div>

    <!-- MODALE BOUTIQUE / RECHARGE -->
    <div id="recharge-modal" onclick="if(event.target === this) closeRechargeModal()" class="hidden absolute inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end justify-center">
      <div class="relative w-full bg-[#faf8f5] rounded-t-[32px] p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom))] border-t border-[#e2d7c5] max-h-[92%] overflow-y-auto no-scrollbar flex flex-col">
        <button onclick="closeRechargeModal()" class="absolute top-5 right-5 w-8 h-8 rounded-full bg-[#eee8dc] text-[#6d645c] hover:bg-[#e2d9ca] flex items-center justify-center text-sm font-bold active:scale-90 transition-all z-10" aria-label="Fermer">✕</button>
        <div class="w-10 h-1 bg-[#dcd4c7] rounded-full mx-auto mb-4 cursor-pointer" onclick="closeRechargeModal()"></div>
        
        <div class="text-center mb-5">
          <div class="w-12 h-12 rounded-full orb-glow mx-auto mb-2 flex items-center justify-center text-xl shadow-sm">✨</div>
          <h2 class="text-base font-brand font-bold text-[#2d2926]">Recharger vos Songes</h2>
          <p class="text-[11px] text-[#8c827a] mt-0.5">Explorez votre inconscient sans interruption.</p>
        </div>

        <div class="space-y-3">
          <div onclick="checkout('pack5')" class="p-3.5 bg-white border border-[#eee7db] hover:border-[#caa255] rounded-2xl flex items-center justify-between cursor-pointer transition-all shadow-sm active:scale-[0.98]">
            <div>
              <p class="text-xs font-bold text-[#2d2926]">Pack 5 Songes</p>
              <p class="text-[10px] text-[#91867c]">Découverte onirique</p>
            </div>
            <span class="px-3.5 py-1.5 bg-[#f5ede2] text-[#9e7d3b] rounded-xl text-xs font-bold">1,99 €</span>
          </div>

          <div onclick="checkout('pack15')" class="p-3.5 bg-white border-2 border-[#caa255] rounded-2xl flex items-center justify-between cursor-pointer transition-all shadow-sm relative active:scale-[0.98]">
            <span class="absolute -top-2.5 right-4 bg-[#9e7d3b] text-white text-[8px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Populaire</span>
            <div>
              <p class="text-xs font-bold text-[#2d2926]">Pack 15 Songes</p>
              <p class="text-[10px] text-[#91867c]">Idéal pour les rêveurs réguliers</p>
            </div>
            <span class="px-3.5 py-1.5 bg-[#9e7d3b] text-white rounded-xl text-xs font-bold">4,99 €</span>
          </div>

          <div onclick="checkout('pack30')" class="p-3.5 bg-white border border-[#eee7db] hover:border-[#caa255] rounded-2xl flex items-center justify-between cursor-pointer transition-all shadow-sm relative active:scale-[0.98]">
            <span class="absolute -top-2.5 right-4 bg-[#7c6332] text-white text-[8px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Meilleur Prix</span>
            <div>
              <p class="text-xs font-bold text-[#2d2926]">Pack 30 Songes</p>
              <p class="text-[10px] text-[#91867c]">L'expérience complète Onira</p>
            </div>
            <span class="px-3.5 py-1.5 bg-[#f5ede2] text-[#9e7d3b] rounded-xl text-xs font-bold">8,99 €</span>
          </div>
        </div>

        <button onclick="closeRechargeModal()" class="w-full mt-5 py-3 bg-[#eee8dc]/70 hover:bg-[#e2d9ca] text-[#6d645c] rounded-xl text-xs font-semibold transition-all">
          Plus tard
        </button>
      </div>
    </div>

    <!-- MODALE DÉTAIL D'UN SONGE -->
    <div id="dream-modal" onclick="if(event.target === this) closeModal()" class="hidden absolute inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end justify-center">
      <div class="relative w-full bg-[#faf8f5] rounded-t-[28px] p-5 pb-[calc(2.5rem+env(safe-area-inset-bottom))] border-t border-[#e2d7c5] max-h-[90%] overflow-y-auto no-scrollbar flex flex-col">
        <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/90 border border-[#e2d7c5] text-[#6d645c] hover:bg-[#eee8dc] flex items-center justify-center text-sm font-bold shadow-sm active:scale-90 transition-all z-20" aria-label="Fermer">✕</button>
        <div class="w-10 h-1 bg-[#dcd4c7] rounded-full mx-auto mb-3 cursor-pointer" onclick="closeModal()"></div>
        
        <div class="relative rounded-2xl overflow-hidden shadow mb-3 h-48 border border-[#e5ded2] flex-shrink-0 bg-[#e8e2d5]">
          <img id="modal-img" src="" class="w-full h-full object-cover">
        </div>
        
        <h2 id="modal-title" class="text-sm font-bold text-[#2d2926] pr-8"></h2>
        <p id="modal-date" class="text-[9px] text-[#91867c] mb-2"></p>
        
        <p id="modal-interpretation" class="text-xs text-[#524b45] leading-relaxed bg-white p-3 rounded-xl border border-[#eee7db] shadow-sm"></p>
        <p id="modal-transcript" class="text-[11px] text-[#6d645c] italic bg-[#f2ece2]/60 p-3 rounded-xl mt-2 border border-[#eee7db]"></p>
        
        <div class="flex gap-2 mt-4 flex-shrink-0">
          <button onclick="deleteDream()" class="w-14 py-2.5 bg-[#fff0f0] text-red-500 rounded-xl border border-red-100 hover:bg-red-50 flex items-center justify-center transition-all" title="Supprimer ce rêve">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
          <button onclick="closeModal()" data-i18n="modalClose" class="flex-1 py-2.5 bg-[#9e7d3b] hover:bg-[#886a30] text-white rounded-xl text-xs font-semibold shadow transition-all"></button>
        </div>
      </div>
    </div>

    <!-- BARRE DE NAVIGATION -->
    <nav class="bg-white/95 border-t border-[#ede7dc] px-12 pt-2.5 pb-[max(0.7rem,env(safe-area-inset-bottom))] flex justify-around text-[11px] text-[#968b80] flex-shrink-0">
      <button id="nav-home" onclick="switchTab('home')" class="flex flex-col items-center gap-1 text-[#a88644] font-semibold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span data-i18n="navHome"></span>
      </button>
      <button id="nav-journal" onclick="switchTab('journal')" class="flex flex-col items-center gap-1 hover:text-[#2d2926]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        <span data-i18n="navJournal"></span>
      </button>
    </nav>
  </div>

  <script>
    // --- DICTIONNAIRE MULTILINGUE ---
    const translations = {
      fr: {
        onbTitle1: "Bienvenue dans Onira", onbDesc1: "La première intelligence artificielle qui décrypte les messages de votre inconscient.",

    function detectLanguage() {
      const userLang = navigator.language || navigator.userLanguage || 'fr';
      const shortLang = userLang.split('-')[0].toLowerCase();
      return translations[shortLang] ? shortLang : 'fr';
    }
    const currentLang = detectLanguage();
    const t = translations[currentLang];

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerHTML = t[key];
      });
      document.getElementById('btn-selfie').innerHTML = `📸 ${localStorage.getItem('onira_avatar_base64') ? 'Selfie enregistré !' : 'Prendre un selfie (Optionnel)'}`;
    }
    applyTranslations();

    // --- LIENS DE PAIEMENT STRIPE ---
    const STRIPE_LINKS = {
      pack5: 'https://buy.stripe.com/fZu8wQ7D59D4fSt6am2Ry02',
      pack15: 'https://buy.stripe.com/aFa8wQ5uX3eG5dPcyK2Ry01',
      pack30: 'https://buy.stripe.com/6oUfZig9B02ucGh56i2Ry00'
    };

    function openRechargeModal() {
      document.getElementById('recharge-modal').classList.remove('hidden');
    }

    function closeRechargeModal() {
      document.getElementById('recharge-modal').classList.add('hidden');
    }

    function checkout(packKey) {
      if (!currentUser || !currentUser.id) {
        alert("Connexion en cours... Réessayez dans un instant.");
        return;
      }
      const baseUrl = STRIPE_LINKS[packKey];
      const checkoutUrl = `${baseUrl}?client_reference_id=${encodeURIComponent(currentUser.id)}`;
      window.location.href = checkoutUrl;
    }

    // --- BASE DE DONNÉES LOCALE INDEXEDDB ---
    const DB_NAME = 'OniraLocalDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'dreams';

    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAllDreams() {
      const db = await initIndexedDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve((req.result || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at)));
        req.onerror = () => reject(req.error);
      });
    }

    async function dbSaveDream(dream) {
      const db = await initIndexedDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).add(dream);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbDeleteDream(id) {
      const db = await initIndexedDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    // --- CONFIGURATION SUPABASE ---
    const supabaseUrl = 'https://vaaszqyjsuvybglvpxbw.supabase.co';
    const supabaseKey = 'sb_publishable_z-_kvTo-oIgebqYOF0qZrw_GmAkEWI0';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let dreamsData = [];
    let currentAnalysis = null;
    let currentDreamIndex = null;
    let currentSlide = 0;

    // --- GESTION DU SELFIE ---
    function handleSelfie(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const max_size = 512;
          let w = img.width, h = img.height;
          if (w > h) { if (w > max_size) { h *= max_size / w; w = max_size; } } 
          else { if (h > max_size) { w *= max_size / h; h = max_size; } }
          
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const base64 = canvas.toDataURL('image/jpeg', 0.8);
          
          localStorage.setItem('onira_avatar_base64', base64);
          
          document.getElementById('avatar-preview').src = base64;
          document.getElementById('avatar-preview').classList.remove('hidden');
          document.getElementById('avatar-icon').classList.add('hidden');
          
          const btn = document.getElementById('btn-selfie');
          btn.innerHTML = `✅ Selfie enregistré !`;
          btn.classList.replace('text-[#9e7d3b]', 'text-green-600');
          btn.classList.replace('border-[#caa255]', 'border-green-400');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function extractAvatarDescription() {
      const base64 = localStorage.getItem('onira_avatar_base64');
      if (!base64 || localStorage.getItem('onira_avatar_desc')) return;
      try {
        const { data } = await supabaseClient.functions.invoke('analyze-avatar', { body: { imageBase64: base64 } });
        if (data && data.description) localStorage.setItem('onira_avatar_desc', data.description);
      } catch (e) {}
    }

    // --- NAVIGATION ONBOARDING & VALIDATION SILENCIEUSE ---
    function nextOnboardingSlide() {
      document.getElementById(`slide-${currentSlide}`).classList.add('opacity-0', 'pointer-events-none');
      document.getElementById(`dot-${currentSlide}`).classList.replace('bg-[#9e7d3b]', 'bg-[#e2d7c5]');
      currentSlide++;
      document.getElementById(`slide-${currentSlide}`).classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById(`dot-${currentSlide}`).classList.replace('bg-[#e2d7c5]', 'bg-[#9e7d3b]');
      
      if (currentSlide === 3) {
        document.getElementById('btn-next-slide').classList.add('hidden');
        document.getElementById('btn-start-app').classList.remove('hidden');
      }
    }

    async function finishOnboarding() {
      const btn = document.getElementById('btn-start-app');
      const prenom = document.getElementById('input-prenom').value.trim();
      const email = document.getElementById('input-email').value.trim();

      if (!prenom) {
        alert("Veuillez indiquer votre prénom pour personnaliser votre accueil.");
        return;
      }

      btn.textContent = "Création du profil...";
      
      // CONNEXION INVISIBLE : Crée un compte instantanément, SANS email à cliquer !
      const { data, error } = await supabaseClient.auth.signInAnonymously();
      
      if (error) {
        alert("Erreur de connexion.");
        btn.innerHTML = t.onbBtnStart;
      } else {
        // Enregistre silencieusement le prénom et l'email dans la base de données
        if (data.user) {
          await supabaseClient.from('profiles').update({
            first_name: prenom,
            email: email || null
          }).eq('id', data.user.id);
        }

        localStorage.setItem('onira_onboarding_done', 'true');
        document.getElementById('screen-onboarding').classList.add('hidden');
        extractAvatarDescription();
        
        // Met à jour la page d'accueil avec "Bonjour Marie"
        fetchUserProfile();
      }
    }

    // --- GESTION DES SESSIONS ---
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      currentUser = session?.user || null;
      const onboardingScreen = document.getElementById('screen-onboarding');

      if (currentUser) {
        onboardingScreen.classList.add('hidden');
        await fetchUserProfile();
        await loadLocalDreams();
        extractAvatarDescription();
      } else {
        if (!localStorage.getItem('onira_onboarding_done')) {
          onboardingScreen.classList.remove('hidden');
        } else {
          await supabaseClient.auth.signInAnonymously();
        }
      }
    });

    async function fetchUserProfile() {
      if (!currentUser) return;
      const { data } = await supabaseClient.from('profiles').select('credits, first_name').eq('id', currentUser.id).single();
      
      if (data) {
        document.getElementById('credits-count').textContent = data.credits ?? 0;
        
        // --- MISE À JOUR DU "BONJOUR MARIE" ---
        const prenom = data.first_name || "Rêveur";
        const optionsDate = { weekday: 'long', day: 'numeric', month: 'long' };
        const dateDuJour = new Intl.DateTimeFormat(currentLang, optionsDate).format(new Date());
        
        const bonjourTexte = document.getElementById('texte-bonjour');
        if (bonjourTexte) {
          bonjourTexte.innerText = `Bonjour ${prenom}, ${dateDuJour}`;
        }
      }
    }

    window.addEventListener('focus', () => { if (currentUser) fetchUserProfile(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && currentUser) fetchUserProfile();
    });

    // --- LOGIQUE JOURNAL ---
    async function loadLocalDreams() {
      dreamsData = await dbGetAllDreams();
      renderJournal(); renderHomeRecents();
    }

    async function saveDream() {
      if (!currentAnalysis) return;
      const btn = document.getElementById('save-btn');
      btn.textContent = t.saving;
      try {
        await dbSaveDream({
          title: currentAnalysis.title, tag: currentAnalysis.tag, transcript: currentAnalysis.transcript,
          interpretation: currentAnalysis.interpretation, image_url: currentAnalysis.img, created_at: new Date().toISOString()
        });
        await loadLocalDreams();
        switchTab('journal');
      } catch (err) { alert(err.message); } 
      finally { btn.textContent = t.saveBtn; }
    }

    async function deleteDream() {
      if (currentDreamIndex === null || !confirm(t.deleteConfirm)) return;
      await dbDeleteDream(dreamsData[currentDreamIndex].id);
      dreamsData.splice(currentDreamIndex, 1);
      renderJournal(); renderHomeRecents(); closeModal();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      return new Date(dateStr).toLocaleDateString(currentLang, { day: 'numeric', month: 'short' });
    }

    function renderHomeRecents() {
      const recentsGrid = document.getElementById('home-recents-grid');
      recentsGrid.innerHTML = '';
      const topTwo = dreamsData.slice(0, 2);
      if (topTwo.length === 0) return recentsGrid.innerHTML = `<div class="col-span-2 text-center text-[10px] text-[#9b9186] py-2">${t.emptyJournal}</div>`;
      topTwo.forEach((dream, index) => {
        const item = document.createElement('div');
        item.className = "bg-white/90 border border-[#eee7db] rounded-xl p-1.5 flex items-center gap-2 shadow-sm cursor-pointer hover:border-[#d9be85]";
        item.onclick = () => openModal(index);
        item.innerHTML = `<img src="${dream.image_url}" class="w-9 h-9 rounded-lg object-cover flex-shrink-0 bg-[#eee]">
          <div class="overflow-hidden text-left"><p class="text-[10px] font-semibold text-[#2d2926] truncate">${dream.title}</p><p class="text-[8px] text-[#9b9186]">${formatDate(dream.created_at)}</p></div>`;
        recentsGrid.appendChild(item);
      });
    }

    function renderJournal() {
      const grid = document.getElementById('journal-grid');
      grid.innerHTML = '';
      if (dreamsData.length === 0) grid.innerHTML = `<p class="col-span-2 text-center text-xs text-[#91867c] mt-8">${t.emptyJournal}</p>`;
      dreamsData.forEach((dream, index) => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl overflow-hidden border border-[#eee7db] shadow-sm cursor-pointer";
        card.onclick = () => openModal(index);
        card.innerHTML = `<div class="h-24 w-full relative bg-[#eee]"><img src="${dream.image_url}" class="w-full h-full object-cover"><span class="absolute top-1.5 right-1.5 px-2 py-0.5 rounded-full text-[8px] bg-white/85 font-medium">${dream.tag}</span></div>
          <div class="p-2"><h3 class="font-semibold text-[11px] truncate">${dream.title}</h3><p class="text-[8px] text-[#91867c] mt-0.5">${formatDate(dream.created_at)}</p></div>`;
        grid.appendChild(card);
      });
      document.getElementById('journal-count').textContent = `${dreamsData.length} ${t.archived}`;
    }

    function openModal(index) {
      currentDreamIndex = index;
      const dream = dreamsData[index];
      document.getElementById('modal-img').src = dream.image_url;
      document.getElementById('modal-title').textContent = dream.title;
      document.getElementById('modal-date').textContent = formatDate(dream.created_at);
      document.getElementById('modal-interpretation').textContent = dream.interpretation;
      document.getElementById('modal-transcript').textContent = `« ${dream.transcript} »`;
      document.getElementById('dream-modal').classList.remove('hidden');
    }
    
    function closeModal() { 
      document.getElementById('dream-modal').classList.add('hidden'); 
      currentDreamIndex = null; 
    }

    function switchTab(tab) {
      ['home', 'journal', 'loading', 'result'].forEach(s => document.getElementById(`screen-${s}`)?.classList.add('hidden'));
      ['home', 'journal'].forEach(b => { const btn = document.getElementById(`nav-${b}`); if(btn) btn.classList.remove('text-[#a88644]', 'font-semibold'); });
      document.getElementById(`screen-${tab}`)?.classList.remove('hidden');
      const targetBtn = document.getElementById(`nav-${tab}`);
      if (targetBtn) targetBtn.classList.add('text-[#a88644]', 'font-semibold');
    }

    // --- RECONNAISSANCE VOCALE & ORBE ---
    let isRecording = false;
    let recognition = null;
    let accumulatedSpeech = "";

    function resetOrbUI() {
      isRecording = false;
      const orb = document.getElementById('orb');
      const badge = document.getElementById('badge-text');
      const dot = document.getElementById('record-indicator');
      const centerIcon = document.getElementById('orb-center-icon');

      orb.classList.remove('recording-active');
      badge.textContent = t.recordBadge;
      badge.classList.replace('text-red-500', 'text-[#7c6332]');
      dot.classList.replace('bg-red-500', 'bg-[#caa255]');
      if (centerIcon) centerIcon.textContent = '✨';
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = t.voiceLangCode;

      recognition.onresult = (event) => {
        let fullTranscript = "";
        for (let i = 0; i < event.results.length; ++i) {
          fullTranscript += event.results[i][0].transcript + " ";
        }
        accumulatedSpeech = fullTranscript.trim();
        if (accumulatedSpeech) {
          document.getElementById('instruction-sub').textContent = accumulatedSpeech;
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed') {
          alert("Accès micro refusé. Veuillez autoriser le microphone dans Safari/Chrome.");
          resetOrbUI();
        }
      };

      recognition.onend = () => {
        if (isRecording && accumulatedSpeech.trim().length === 0) {
          resetOrbUI();
        }
      };
    }

    function handleRecordAction() {
      if (!currentUser) return;
      if (!recognition) return alert("Microphone non supporté sur ce navigateur.");

      const orb = document.getElementById('orb');
      const badge = document.getElementById('badge-text');
      const dot = document.getElementById('record-indicator');
      const centerIcon = document.getElementById('orb-center-icon');

      if (!isRecording) {
        isRecording = true;
        accumulatedSpeech = "";
        try { recognition.start(); } catch(e) {}

        orb.classList.add('recording-active');
        badge.textContent = t.stopBadge;
        badge.classList.replace('text-[#7c6332]', 'text-red-500');
        dot.classList.replace('bg-[#caa255]', 'bg-red-500');
        if (centerIcon) centerIcon.textContent = '⏹';
        document.getElementById('instruction-sub').textContent = t.listening;
      } else {
        try { recognition.stop(); } catch(e) { try { recognition.abort(); } catch(err) {} }
        resetOrbUI();

        const textToProcess = accumulatedSpeech.trim();
        if (textToProcess) {
          switchTab('loading');
          processDreamWithBackend(textToProcess);
        } else {
          document.getElementById('instruction-sub').textContent = t.instructionSub;
          alert("Aucune parole détectée. Racontez votre songe à voix haute avant d'arrêter.");
        }
      }
    }

    // --- GÉNÉRATION DU RÊVE ---
    async function processDreamWithBackend(transcript) {
      try {
        const userAppearance = localStorage.getItem('onira_avatar_desc');
        
        const { data, error } = await supabaseClient.functions.invoke('process-dream', {
          body: { transcript, aiLangName: t.aiLangName, userAppearance }
        });

        if (error) throw new Error(error.message || "Erreur de traitement.");
        
        if (data?.error === 'OUT_OF_CREDITS') {
          switchTab('home');
          openRechargeModal();
          return;
        }
        if (data?.error) throw new Error(data.error);

        currentAnalysis = { 
          title: data.title, 
          tag: data.tag, 
          interpretation: data.interpretation, 
          transcript: transcript, 
          img: data.img 
        };

        document.getElementById('result-title').textContent = currentAnalysis.title;
        document.getElementById('result-badge').textContent = currentAnalysis.tag;
        document.getElementById('result-interpretation').textContent = currentAnalysis.interpretation;
        document.getElementById('result-transcript').textContent = `« ${currentAnalysis.transcript} »`;
        
        const imgEl = document.getElementById('result-img');
        imgEl.src = currentAnalysis.img;
        imgEl.onload = () => { 
          imgEl.classList.remove('hidden'); 
          document.getElementById('result-img-placeholder').classList.add('hidden'); 
        };

        await fetchUserProfile();
        switchTab('result');
      } catch (err) { 
        alert(err.message); 
        switchTab('home'); 
      }
    }
  </script>
