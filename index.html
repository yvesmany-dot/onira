<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Onira - Journal de Rêves IA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f1ea; }
    .font-brand { font-family: 'Cinzel', serif; letter-spacing: 0.22em; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .orb-glow {
      background: radial-gradient(circle at 45% 45%, #ffffff 0%, #ffe8b8 25%, #ffd1dc 50%, #d6e4ff 75%, #f5e6ff 100%);
      box-shadow: 0 15px 35px rgba(230, 200, 160, 0.35), 0 0 25px rgba(210, 220, 255, 0.4);
      transition: all 0.3s ease;
    }
    .orb-pulse { animation: pulse-soft 3.2s ease-in-out infinite; }
    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.04); filter: brightness(1.08); box-shadow: 0 20px 45px rgba(230, 195, 140, 0.5); }
    }
    .recording-active { animation: pulse-rec 1s ease-in-out infinite alternate !important; border: 2px solid rgba(255, 100, 100, 0.3); }
    @keyframes pulse-rec {
      from { transform: scale(0.96); filter: brightness(1.05); }
      to { transform: scale(1.08); filter: brightness(1.2); box-shadow: 0 0 50px rgba(245, 100, 100, 0.4); }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 select-none bg-[#f4f1ea]">

  <div class="relative w-full max-w-[390px] h-[100dvh] sm:h-[844px] bg-[#faf8f5] text-[#2d2926] rounded-none sm:rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between border-0 sm:border-[6px] border-[#e8e2d8]">

    <!-- ÉCRAN ONBOARDING MULTILINGUE -->
    <div id="screen-onboarding" class="hidden absolute inset-0 z-[60] bg-[#faf8f5] flex flex-col justify-between p-6 sm:rounded-[38px]">
      <div class="flex-1 flex flex-col items-center justify-center text-center relative overflow-hidden mt-8">
        
        <!-- Slide 1 -->
        <div id="slide-0" class="slide-content absolute inset-0 flex flex-col items-center justify-center transition-opacity duration-500">
          <div class="w-24 h-24 mb-6 rounded-full orb-glow flex items-center justify-center text-3xl">✨</div>
          <h2 data-i18n="onbTitle1" class="text-xl font-brand font-bold text-[#9e7d3b] mb-3"></h2>
          <p data-i18n="onbDesc1" class="text-xs text-[#524b45] leading-relaxed px-4"></p>
        </div>

        <!-- Slide 2 -->
        <div id="slide-1" class="slide-content absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
          <div class="w-24 h-24 mb-6 rounded-full orb-glow flex items-center justify-center text-3xl">🎙️</div>
          <h2 data-i18n="onbTitle2" class="text-xl font-brand font-bold text-[#9e7d3b] mb-3"></h2>
          <p data-i18n="onbDesc2" class="text-xs text-[#524b45] leading-relaxed px-4"></p>
        </div>

        <!-- Slide 3 -->
        <div id="slide-2" class="slide-content absolute inset-0 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
          <div class="w-24 h-24 mb-6 rounded-full orb-glow flex items-center justify-center text-3xl">📖</div>
          <h2 data-i18n="onbTitle3" class="text-xl font-brand font-bold text-[#9e7d3b] mb-3"></h2>
          <p data-i18n="onbDesc3" class="text-xs text-[#524b45] leading-relaxed px-4"></p>
        </div>

      </div>

      <!-- Boutons Onboarding -->
      <div class="mb-6 flex flex-col items-center w-full">
        <div class="flex gap-2 mb-8">
          <div id="dot-0" class="w-2 h-2 rounded-full bg-[#9e7d3b] transition-all"></div>
          <div id="dot-1" class="w-2 h-2 rounded-full bg-[#e2d7c5] transition-all"></div>
          <div id="dot-2" class="w-2 h-2 rounded-full bg-[#e2d7c5] transition-all"></div>
        </div>
        <button id="btn-next-slide" onclick="nextOnboardingSlide()" data-i18n="onbBtnNext" class="w-full py-3.5 bg-[#9e7d3b] text-white rounded-xl text-xs font-semibold shadow-lg hover:bg-[#886a30] transition-all"></button>
        <button id="btn-start-app" onclick="finishOnboarding()" data-i18n="onbBtnStart" class="hidden w-full py-3.5 bg-[#9e7d3b] text-white rounded-xl text-xs font-bold shadow-lg hover:bg-[#886a30] transition-all"></button>
      </div>
    </div>

    <!-- En-tête : Réglages & Déconnexion -->
    <div class="absolute top-4 sm:top-6 right-5 z-20 flex items-center gap-2">
      <button onclick="toggleSettingsModal(true)" class="w-8 h-8 rounded-full bg-white/85 border border-[#e2d7c5] flex items-center justify-center text-[#9e7d3b] shadow-sm hover:scale-105 active:scale-95 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>
      <button id="logout-btn" onclick="handleLogout()" data-i18n="logoutBtn" class="hidden px-2.5 py-1 rounded-full bg-white/85 border border-[#e2d7c5] text-[10px] font-semibold text-[#9e7d3b] shadow-sm hover:scale-105 active:scale-95 transition-all">
      </button>
    </div>

    <!-- ÉCRAN 1 : ACCUEIL -->
    <div id="screen-home" class="flex-1 flex flex-col justify-between overflow-hidden">
      <header class="pt-4 sm:pt-6 pb-0 px-6 text-center flex-shrink-0">
        <div class="mx-auto w-8 h-8 rounded-full mb-1 flex items-center justify-center p-0.5 relative">
          <div class="w-full h-full rounded-full border border-[#e5c583]/60 flex items-center justify-center shadow-inner" style="background: radial-gradient(circle, #fffdf8 30%, #fde7b0 70%, #d8e5ff 100%);">
            <div class="w-2.5 h-2.5 rounded-full bg-gradient-to-tr from-[#eac575] to-[#f4dca6]"></div>
          </div>
        </div>
        <h1 class="font-brand text-[11px] font-bold text-[#9e7d3b] tracking-[0.28em] uppercase">ONIRA</h1>
      </header>

      <main class="flex-1 flex flex-col items-center justify-evenly px-5 py-2 min-h-0">
        <div id="orb" class="w-40 h-40 rounded-full orb-glow orb-pulse flex flex-col items-center justify-center relative cursor-pointer active:scale-95 transition-all">
          <div class="px-3.5 py-1 bg-white/80 backdrop-blur-md rounded-full border border-white flex items-center shadow-sm">
            <div id="record-indicator" class="w-2 h-2 rounded-full bg-[#caa255] mr-2"></div>
            <span id="badge-text" data-i18n="recordBadge" class="text-[11px] font-bold text-[#7c6332]"></span>
          </div>
        </div>

        <div class="text-center px-2 max-w-[280px]">
          <h2 id="instruction-title" data-i18n="instructionTitle" class="text-xs font-semibold text-[#3b342f]"></h2>
          <p id="instruction-sub" data-i18n="instructionSub" class="text-[10px] text-[#91867c] mt-0.5 min-h-[1.2rem] line-clamp-2"></p>
        </div>

        <div class="w-full">
          <div class="flex justify-between items-center text-[10px] text-[#8e857c] px-1 mb-1.5 font-medium">
            <span data-i18n="recentDreams"></span>
            <button onclick="switchTab('journal')" data-i18n="viewJournal" class="text-[#a88644] text-[10px] hover:underline font-semibold"></button>
          </div>
          <div id="home-recents-grid" class="grid grid-cols-2 gap-2">
            <div class="col-span-2 text-center text-[10px] text-[#a3978b] py-2 italic" data-i18n="syncing"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- ÉCRAN 2 : CHARGEMENT -->
    <div id="screen-loading" class="hidden flex-1 flex flex-col items-center justify-center px-8 text-center bg-[#faf8f5]">
      <div class="w-28 h-28 rounded-full orb-glow orb-pulse flex items-center justify-center mb-5">
        <svg class="w-9 h-9 text-[#a88644] animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </div>
      <h3 id="loading-step" data-i18n="loadingTitle" class="text-xs font-semibold text-[#2d2926]"></h3>
      <p id="loading-sub" data-i18n="loadingSub" class="text-[10px] text-[#8c827a] mt-1"></p>
    </div>

    <!-- ÉCRAN 3 : RÉSULTAT -->
    <div id="screen-result" class="hidden flex-1 flex flex-col overflow-y-auto no-scrollbar p-4">
      <div class="flex justify-between items-center mb-2.5">
        <span data-i18n="newDream" class="text-[10px] uppercase font-bold tracking-widest text-[#a88644]"></span>
        <button onclick="switchTab('home')" class="text-xs text-[#8c827a] p-1">✕</button>
      </div>

      <div class="relative rounded-2xl overflow-hidden shadow-md h-48 border border-[#e5ded2] mb-3 bg-[#f0ebd8]">
        <img id="result-img" src="" class="w-full h-full object-cover hidden">
        <div id="result-img-placeholder" class="text-center p-4 pt-16">
          <svg class="w-8 h-8 mx-auto text-[#caa255] animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-transparent flex items-end p-3">
          <div>
            <span id="result-badge" class="px-2 py-0.5 rounded-full text-[8px] font-semibold bg-[#a88644] text-white"></span>
            <h2 id="result-title" class="text-sm font-bold text-white mt-1"></h2>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl p-3.5 border border-[#eee7db] shadow-sm mb-2.5">
        <h3 data-i18n="decryptionTitle" class="text-[10px] font-bold text-[#9e7d3b] uppercase tracking-wider mb-1.5"></h3>
        <p id="result-interpretation" class="text-xs text-[#524b45] leading-relaxed"></p>
      </div>

      <div class="bg-[#f2ece2]/60 rounded-xl p-3 border border-[#eee7db] mb-3">
        <p data-i18n="yourStory" class="text-[9px] font-semibold text-[#8c827a] mb-1"></p>
        <p id="result-transcript" class="text-[11px] text-[#635b54] italic leading-relaxed"></p>
      </div>

      <button id="save-btn" onclick="saveToSupabase()" data-i18n="saveBtn" class="w-full py-2.5 bg-[#9e7d3b] hover:bg-[#886a30] text-white rounded-xl text-xs font-semibold shadow transition-all"></button>
    </div>

    <!-- ÉCRAN 4 : JOURNAL -->
    <div id="screen-journal" class="hidden flex-1 flex flex-col overflow-hidden">
      <header class="pt-4 sm:pt-6 pb-2.5 px-5 border-b border-[#eee8dc] bg-[#faf8f5]/90 flex-shrink-0">
        <h1 data-i18n="journalTitle" class="text-base font-bold text-[#2d2926]"></h1>
        <p id="journal-count" class="text-[10px] text-[#91867c]">...</p>
      </header>
      <main class="flex-1 overflow-y-auto no-scrollbar p-3.5">
        <div id="journal-grid" class="grid grid-cols-2 gap-2.5 pb-4"></div>
      </main>
    </div>

    <!-- MODALE CLÉ OPENAI -->
    <div id="settings-modal" class="hidden absolute inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-5">
      <div class="w-full bg-[#faf8f5] rounded-3xl p-5 border border-[#e2d7c5] shadow-2xl">
        <h3 data-i18n="settingsTitle" class="text-xs font-bold text-[#2d2926]"></h3>
        <input id="api-key-input" type="password" placeholder="sk-..." class="w-full mt-2.5 px-3 py-2 text-xs border border-[#ddd3c4] rounded-xl bg-white">
        <div class="mt-3.5 flex gap-2">
          <button onclick="saveApiKey()" data-i18n="settingsSave" class="flex-1 py-2 bg-[#9e7d3b] text-white rounded-xl text-xs font-semibold"></button>
          <button onclick="toggleSettingsModal(false)" data-i18n="settingsClose" class="px-4 py-2 border border-[#ddd3c4] text-[#736a61] rounded-xl text-xs"></button>
        </div>
      </div>
    </div>

    <!-- MODALE AUTHENTIFICATION CLASSICAL -->
    <div id="auth-modal" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-5">
      <div class="w-full bg-[#faf8f5] rounded-3xl p-6 border border-[#e2d7c5] shadow-2xl text-center">
        <h3 data-i18n="authTitle" class="text-sm font-bold text-[#2d2926] mb-1"></h3>
        <p data-i18n="authSubtitle" class="text-[10px] text-[#91867c] mb-4"></p>
        
        <input id="auth-email" type="email" placeholder="Email" class="w-full mb-2.5 px-3 py-2 text-xs border border-[#ddd3c4] rounded-xl bg-white focus:outline-none focus:border-[#a88644]">
        <input id="auth-password" type="password" placeholder="Password (min. 6)" class="w-full mb-3.5 px-3 py-2 text-xs border border-[#ddd3c4] rounded-xl bg-white focus:outline-none focus:border-[#a88644]">
        
        <div class="flex flex-col gap-2">
          <button onclick="handleAuth('login')" data-i18n="authLogin" class="w-full py-2.5 bg-[#9e7d3b] text-white rounded-xl text-xs font-semibold shadow hover:bg-[#886a30] transition"></button>
          <button onclick="handleAuth('signup')" data-i18n="authSignup" class="w-full py-2.5 bg-white border border-[#9e7d3b] text-[#9e7d3b] rounded-xl text-xs font-semibold hover:bg-[#faf8f5] transition"></button>
        </div>
        <p id="auth-error" class="text-[10px] text-red-500 mt-2.5 hidden"></p>
      </div>
    </div>

    <!-- MODALE DÉTAIL D'UN SONGE -->
    <div id="dream-modal" class="hidden absolute inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end justify-center">
      <div class="w-full bg-[#faf8f5] rounded-t-[28px] p-5 border-t border-[#e2d7c5] max-h-[88%] overflow-y-auto no-scrollbar flex flex-col">
        <div class="w-8 h-1 bg-[#dcd4c7] rounded-full mx-auto mb-3 cursor-pointer" onclick="closeModal()"></div>
        <div class="relative rounded-2xl overflow-hidden shadow mb-3 h-44 border border-[#e5ded2] flex-shrink-0">
          <img id="modal-img" src="" class="w-full h-full object-cover">
        </div>
        <h2 id="modal-title" class="text-sm font-bold text-[#2d2926]"></h2>
        <p id="modal-date" class="text-[9px] text-[#91867c] mb-2"></p>
        <p id="modal-interpretation" class="text-xs text-[#524b45] leading-relaxed bg-white p-3 rounded-xl border border-[#eee7db]"></p>
        <p id="modal-transcript" class="text-[11px] text-[#6d645c] italic bg-[#f2ece2]/60 p-3 rounded-xl mt-2"></p>
        
        <!-- Boutons d'action : Fermer et Supprimer -->
        <div class="flex gap-2 mt-4 flex-shrink-0">
          <button onclick="deleteDream()" class="w-14 py-2.5 bg-[#fff0f0] text-red-500 rounded-xl border border-red-100 hover:bg-red-50 flex items-center justify-center transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
          <button onclick="closeModal()" data-i18n="settingsClose" class="flex-1 py-2.5 bg-[#9e7d3b] hover:bg-[#886a30] text-white rounded-xl text-xs font-semibold transition-all"></button>
        </div>
      </div>
    </div>

    <!-- BARRE DE NAVIGATION -->
    <nav class="bg-white/95 border-t border-[#ede7dc] px-6 pt-2 pb-[max(0.6rem,env(safe-area-inset-bottom))] flex justify-between text-[10px] text-[#968b80] flex-shrink-0">
      <button id="nav-home" onclick="switchTab('home')" class="flex flex-col items-center gap-0.5 text-[#a88644] font-semibold">
        <span data-i18n="navHome"></span>
      </button>
      <button id="nav-journal" onclick="switchTab('journal')" class="flex flex-col items-center gap-0.5 hover:text-[#2d2926]">
        <span data-i18n="navJournal"></span>
      </button>
      <button onclick="toggleSettingsModal(true)" class="flex flex-col items-center gap-0.5 hover:text-[#2d2926]">
        <span data-i18n="navSettings"></span>
      </button>
    </nav>
  </div>

        recordBadge: "Gravar", stopBadge: "Parar", instructionTitle: "Toque na esfera para falar", instructionSub: "Fale livremente ao acordar",
        recentDreams: "Sonhos recentes", viewJournal: "Ver diário →", syncing: "Sincronizando sonhos...",
        loadingTitle: "Decifrando sonho...", loadingSub: "O inconsciente ganha forma...",
        newDream: "Novo Sonho", decryptionTitle: "Análise Onira", yourStory: "Seu relato:", saveBtn: "Guardar no Diário",
        journalTitle: "Diário Onira", emptyJournal: "Seu diário está vazio.", archived: "sonhos arquivados",

        deleteConfirm: "Tem a certeza de que deseja excluir este sonho permanentemente?",
        navHome: "Início", navJournal: "Diário", navSettings: "Definições IA",
        listening: "A ouvir... Fale e toque na esfera para parar.", saving: "A guardar...",
        aiLangName: "PORTUGUÊS", voiceLangCode: "pt-PT"
      }
    };

    function detectLanguage() {
      const userLang = navigator.language || navigator.userLanguage || 'fr';
      const shortLang = userLang.split('-')[0].toLowerCase();
      return translations[shortLang] ? shortLang : 'fr';
    }
    const currentLang = detectLanguage();
    const t = translations[currentLang];

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerHTML = t[key];
      });
    }
    applyTranslations();

    // --- CONFIGURATION SUPABASE ---
    const supabaseUrl = 'https://vaaszqyjsuvybglvpxbw.supabase.co';
    const supabaseKey = 'sb_publishable_z-_kvTo-oIgebqYOF0qZrw_GmAkEWI0';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let dreamsData = [];
    let currentAnalysis = null;
    let currentDreamIndex = null; // Mémorise le rêve actuellement ouvert

    // --- GESTION ONBOARDING ---
    let currentSlide = 0;

    function nextOnboardingSlide() {
      document.getElementById(`slide-${currentSlide}`).classList.add('opacity-0', 'pointer-events-none');
      document.getElementById(`dot-${currentSlide}`).classList.replace('bg-[#9e7d3b]', 'bg-[#e2d7c5]');
      currentSlide++;
      document.getElementById(`slide-${currentSlide}`).classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById(`dot-${currentSlide}`).classList.replace('bg-[#e2d7c5]', 'bg-[#9e7d3b]');
      if (currentSlide === 2) {
        document.getElementById('btn-next-slide').classList.add('hidden');
        document.getElementById('btn-start-app').classList.remove('hidden');
      }
    }

    async function finishOnboarding() {
      const btn = document.getElementById('btn-start-app');
      btn.textContent = "...";
      const { error } = await supabaseClient.auth.signInAnonymously();
      if (error) {
        alert("Erreur de connexion. Vérifiez que 'Anonymous Sign-ins' est activé dans Supabase.");
        btn.innerHTML = t.onbBtnStart;
      } else {
        localStorage.setItem('onira_onboarding_done', 'true');
        document.getElementById('screen-onboarding').classList.add('hidden');
      }
    }

    // Changement d'état de connexion
    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      const authModal = document.getElementById('auth-modal');
      const logoutBtn = document.getElementById('logout-btn');
      const onboardingScreen = document.getElementById('screen-onboarding');

      if (currentUser) {
        authModal.classList.add('hidden');
        onboardingScreen.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
        fetchDreamsFromCloud();
      } else {
        logoutBtn.classList.add('hidden');
        dreamsData = [];
        renderJournal();
        renderHomeRecents();
        
        if (!localStorage.getItem('onira_onboarding_done')) {
          onboardingScreen.classList.remove('hidden');
        } else {
          authModal.classList.remove('hidden');
        }
      }
    });

    async function handleAuth(action) {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const errorEl = document.getElementById('auth-error');
      errorEl.classList.add('hidden');

      if (!email || password.length < 6) {
        errorEl.textContent = "Email invalide ou mot de passe trop court.";
        errorEl.classList.remove('hidden');
        return;
      }

      let res;
      if (action === 'signup') {
        res = await supabaseClient.auth.signUp({ email, password });
      } else {
        res = await supabaseClient.auth.signInWithPassword({ email, password });
      }

      if (res.error) {
        errorEl.textContent = res.error.message;
        errorEl.classList.remove('hidden');
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
    }

    // --- BASE DE DONNÉES ET STOCKAGE ---
    async function fetchDreamsFromCloud() {
      if (!currentUser) return;
      const { data, error } = await supabaseClient
        .from('dreams')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (!error) {
        dreamsData = data || [];
        renderJournal();
        renderHomeRecents();
      }
    }

    async function saveToSupabase() {
      if (!currentAnalysis || !currentUser) return;
      const btn = document.getElementById('save-btn');
      btn.textContent = t.saving;

      try {
        let permanentImageUrl = currentAnalysis.img;

        try {
          const res = await fetch(currentAnalysis.img);
          const imageBlob = await res.blob();
          const fileName = `${currentUser.id}_${Date.now()}.png`;
          const { error: uploadError } = await supabaseClient.storage.from('dream_images').upload(fileName, imageBlob, { contentType: 'image/png', upsert: false });
          if (!uploadError) {
            const { data: publicUrlData } = supabaseClient.storage.from('dream_images').getPublicUrl(fileName);
            if (publicUrlData?.publicUrl) permanentImageUrl = publicUrlData.publicUrl;
          }
        } catch(storageErr) {
          console.warn("Stockage direct de l'URL distante :", storageErr);
        }

        const { error: dbError } = await supabaseClient.from('dreams').insert([{
          user_id: currentUser.id,
          title: currentAnalysis.title,
          tag: currentAnalysis.tag,
          transcript: currentAnalysis.transcript,
          interpretation: currentAnalysis.interpretation,
          image_url: permanentImageUrl
        }]);

        if (dbError) throw new Error("Erreur base : " + dbError.message);

        await fetchDreamsFromCloud();
        switchTab('journal');
      } catch (err) {
        alert(err.message);
      } finally {
        btn.textContent = t.saveBtn;
      }
    }

    // --- SUPPRESSION D'UN RÊVE ---
    async function deleteDream() {
      if (currentDreamIndex === null) return;
      
      const dream = dreamsData[currentDreamIndex];
      if (!confirm(t.deleteConfirm)) return;
      
      // Suppression de la base de données (l'id du rêve est nécessaire)
      const { error } = await supabaseClient
        .from('dreams')
        .delete()
        .eq('id', dream.id);

      if (error) {
        alert("Erreur lors de la suppression : " + error.message);
        return;
      }

      // Mise à jour de l'affichage local
      dreamsData.splice(currentDreamIndex, 1);
      renderJournal();
      renderHomeRecents();
      closeModal();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      return new Date(dateStr).toLocaleDateString(currentLang, { day: 'numeric', month: 'short' });
    }

    function renderHomeRecents() {
      const recentsGrid = document.getElementById('home-recents-grid');
      if (!recentsGrid) return;
      recentsGrid.innerHTML = '';
      const topTwo = dreamsData.slice(0, 2);

      if (topTwo.length === 0) {
        recentsGrid.innerHTML = `<div class="col-span-2 text-center text-[10px] text-[#9b9186] py-2">${t.emptyJournal}</div>`;
        return;
      }
      topTwo.forEach((dream, index) => {
        const item = document.createElement('div');
        item.className = "bg-white/90 border border-[#eee7db] rounded-xl p-1.5 flex items-center gap-2 shadow-sm cursor-pointer hover:border-[#d9be85]";
        item.onclick = () => openModal(index);
        item.innerHTML = `<img src="${dream.image_url}" class="w-9 h-9 rounded-lg object-cover flex-shrink-0 bg-[#eee]">
          <div class="overflow-hidden text-left">
            <p class="text-[10px] font-semibold text-[#2d2926] truncate">${dream.title}</p>
            <p class="text-[8px] text-[#9b9186]">${formatDate(dream.created_at)}</p>
          </div>`;
        recentsGrid.appendChild(item);
      });
    }

    function renderJournal() {
      const grid = document.getElementById('journal-grid');
      grid.innerHTML = '';
      if (dreamsData.length === 0) {
        grid.innerHTML = `<p class="col-span-2 text-center text-xs text-[#91867c] mt-8">${t.emptyJournal}</p>`;
      }
      dreamsData.forEach((dream, index) => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl overflow-hidden border border-[#eee7db] shadow-sm cursor-pointer";
        card.onclick = () => openModal(index);
        card.innerHTML = `<div class="h-24 w-full relative bg-[#eee]">
            <img src="${dream.image_url}" class="w-full h-full object-cover">
            <span class="absolute top-1.5 right-1.5 px-2 py-0.5 rounded-full text-[8px] bg-white/85 font-medium">${dream.tag}</span>
          </div>
          <div class="p-2">
            <h3 class="font-semibold text-[11px] truncate">${dream.title}</h3>
            <p class="text-[8px] text-[#91867c] mt-0.5">${formatDate(dream.created_at)}</p>
          </div>`;
        grid.appendChild(card);
      });
      document.getElementById('journal-count').textContent = `${dreamsData.length} ${t.archived}`;
    }

    function openModal(index) {
      currentDreamIndex = index; // Mémorise le rêve pour la suppression éventuelle
      const dream = dreamsData[index];
      document.getElementById('modal-img').src = dream.image_url;
      document.getElementById('modal-title').textContent = dream.title;
      document.getElementById('modal-date').textContent = formatDate(dream.created_at);
      document.getElementById('modal-interpretation').textContent = dream.interpretation;
      document.getElementById('modal-transcript').textContent = `« ${dream.transcript} »`;
      document.getElementById('dream-modal').classList.remove('hidden');
    }
    
    function closeModal() { 
      document.getElementById('dream-modal').classList.add('hidden'); 
      currentDreamIndex = null;
    }

    function switchTab(tab) {
      ['home', 'journal', 'loading', 'result'].forEach(s => document.getElementById(`screen-${s}`)?.classList.add('hidden'));
      ['home', 'journal'].forEach(b => {
        const btn = document.getElementById(`nav-${b}`);
        if(btn) btn.classList.remove('text-[#a88644]', 'font-semibold');
      });
      document.getElementById(`screen-${tab}`)?.classList.remove('hidden');
      const targetBtn = document.getElementById(`nav-${tab}`);
      if (targetBtn) targetBtn.classList.add('text-[#a88644]', 'font-semibold');
    }

    function getApiKey() { return localStorage.getItem('onira_openai_key') || ''; }
    function saveApiKey() {
      const val = document.getElementById('api-key-input').value.trim();
      if (val) { localStorage.setItem('onira_openai_key', val); toggleSettingsModal(false); }
    }
    function toggleSettingsModal(show) {
      const modal = document.getElementById('settings-modal');
      if (show) { document.getElementById('api-key-input').value = getApiKey(); modal.classList.remove('hidden'); }
      else modal.classList.add('hidden');
    }

    // --- RECONNAISSANCE VOCALE MULTILINGUE ---
    let isRecording = false;
    let recognition;
    let accumulatedSpeech = "";
    
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = t.voiceLangCode;

      recognition.onresult = (event) => {
        let fullTranscript = "";
        for (let i = 0; i < event.results.length; ++i) {
          fullTranscript += event.results[i][0].transcript + " ";
        }
        accumulatedSpeech = fullTranscript.trim();
        if (accumulatedSpeech) {
          document.getElementById('instruction-sub').textContent = accumulatedSpeech;
        }
      };
      recognition.onerror = (e) => console.warn("Speech error :", e.error);
    }

    // --- MOTEUR IA ADAPTÉ À LA LANGUE ---
    async function processDreamWithOpenAI(transcript) {
      const apiKey = getApiKey();
      if (!apiKey) {
        alert("Clé OpenAI introuvable. Rendez-vous dans Réglages AI.");
        switchTab('home'); 
        return;
      }

      try {
        const promptSystem = `Tu es Onira. Décrypte le rêve. JSON requis: {"title":"Titre poétique en ${t.aiLangName}", "mood":"Humeur en ${t.aiLangName}", "interpretation":"Analyse détaillée en ${t.aiLangName}", "image_prompt":"Prompt for surreal dreamy digital art in English."}`;
        
        const chatRes = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({
            model: "gpt-4o-mini", 
            response_format: { type: "json_object" },
            messages: [ { role: "system", content: promptSystem }, { role: "user", content: transcript } ]
          })
        });
        
        const chatData = await chatRes.json();
        if (chatData.error) throw new Error("Erreur OpenAI (Texte) : " + chatData.error.message);

        const result = JSON.parse(chatData.choices[0].message.content);

        document.getElementById('loading-step').textContent = t.loadingTitle;
        
        const imgRes = await fetch('https://api.openai.com/v1/images/generations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({ 
            model: "gpt-image-2.5-flare", 
            prompt: result.image_prompt, 
            n: 1, 
            size: "1024x1024"
          })
        });
        
        const imgData = await imgRes.json();
        if (imgData.error) throw new Error("Erreur OpenAI (Image) : " + imgData.error.message);

        let imageUrl = "";
        const item = imgData.data?.[0];
        if (item) {
          if (item.url) imageUrl = item.url;
          else if (item.b64_json) imageUrl = `data:image/png;base64,${item.b64_json}`;
        }

        if (!imageUrl) throw new Error("Format d'image non reconnu.");

        currentAnalysis = {
          title: result.title, tag: result.mood, interpretation: result.interpretation, transcript: transcript, img: imageUrl
        };

        document.getElementById('result-title').textContent = currentAnalysis.title;
        document.getElementById('result-badge').textContent = currentAnalysis.tag;
        document.getElementById('result-interpretation').textContent = currentAnalysis.interpretation;
        document.getElementById('result-transcript').textContent = `« ${currentAnalysis.transcript} »`;
        
        const imgEl = document.getElementById('result-img');
        imgEl.src = currentAnalysis.img;
        imgEl.onload = () => { 
          imgEl.classList.remove('hidden'); 
          document.getElementById('result-img-placeholder').classList.add('hidden'); 
        };

        switchTab('result');
      } catch (err) { 
        alert(err.message); 
        switchTab('home'); 
      }
    }

    function handleRecordAction() {
      if (!currentUser) return;
      if (!recognition) return alert("Votre navigateur ne supporte pas le micro.");
      
      const orb = document.getElementById('orb');
      const badge = document.getElementById('badge-text');
      const dot = document.getElementById('record-indicator');
      
      if (!isRecording) {
        isRecording = true; 
        accumulatedSpeech = "";
        try { recognition.start(); } catch(e) {}
        
        orb.classList.add('recording-active');
        badge.textContent = t.stopBadge;
        badge.classList.replace('text-[#7c6332]', 'text-red-500');
        dot.classList.replace('bg-[#caa255]', 'bg-red-500');
        document.getElementById('instruction-sub').textContent = t.listening;
      } else {
        isRecording = false; 
        try { recognition.stop(); } catch(e) {}
        
        orb.classList.remove('recording-active');
        badge.textContent = t.recordBadge;
        badge.classList.replace('text-red-500', 'text-[#7c6332]');
        dot.classList.replace('bg-red-500', 'bg-[#caa255]');
        
        const textToProcess = accumulatedSpeech.trim();
        if (textToProcess) {
          switchTab('loading');
          processDreamWithOpenAI(textToProcess);
        } else {
          document.getElementById('instruction-sub').textContent = t.instructionSub;
          alert("Aucune parole détectée. Veuillez réappuyer sur l'orbe et parler distinctement.");
        }
      }
    }

    document.getElementById('orb').addEventListener('click', handleRecordAction);
  </script>
